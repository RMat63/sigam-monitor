name: Monitor Sigam

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "monitorar ou reconhecer (manda prints das telas)"
        default: "monitorar"
        required: true

permissions:
  contents: write

concurrency:
  group: sigam
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verificar processos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PROCESSOS: ${{ vars.PROCESSOS }}
          MODO: ${{ github.event.inputs.modo || 'monitorar' }}
        run: python monitor.py

      - name: Guardar última leitura
        if: always()
        run: |
          git config user.name "robo-sigam"
          git config user.email "robo-sigam@users.noreply.github.com"
          git add estado/estado.json STATUS.md 2>/dev/null || exit 0
          git diff --cached --quiet || { git commit -m "leitura $(date -u +%FT%TZ)" && git push; }
